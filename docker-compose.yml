# =============================================================================
# Meridian — local stack
# =============================================================================
#   docker compose up -d                 backend + redis  (what you want)
#   docker compose --profile osrm up -d   + local routing engine
#   docker compose --profile mobile up    + Expo dev server in a container
#
# Normally you do not run this directly — `scripts/run.ps1` (Windows) or
# `scripts/run.sh` brings up the stack AND starts Expo in one command.
#
# -----------------------------------------------------------------------------
# What is deliberately NOT here
# -----------------------------------------------------------------------------
# * postgres — the database is Supabase. A local Postgres container would be a
#   second, divergent source of truth, and backend/migrations/supabase/SCHEMA.sql
#   targets Supabase's auth.users and storage schemas, which a bare postgres
#   image does not have.
#
# * flower — the worker below logs every run, and `agent_runs` records them.
#   A dashboard can wait for more than two agents.
# =============================================================================

services:
  # ===========================================================================
  # api — FastAPI + the vision stack
  # ===========================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: meridian-api:dev
    container_name: meridian-api
    env_file:
      - ./backend/.env
    environment:
      # `environment` wins over `env_file`, which is the point: inside the
      # network Redis is `redis`, not `localhost`, whatever backend/.env says.
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # DATABASE_URL comes from backend/.env and points at Supabase — reachable
      # from the container as an ordinary outbound connection.
      #
      # D07's local vision tier runs as a native Windows process, not a service
      # here, so it sees the GPU without WSL2 passthrough. Same reason as Redis
      # above: inside the container 127.0.0.1 is the container, so the default in
      # config.py would reach nothing. Overriding here rather than in backend/.env
      # keeps one value correct in both places — host scripts get 127.0.0.1.
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      # Live reload: edit on the host, uvicorn restarts in the container.
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      # The eval image set and its committed baseline. Without this mount the
      # harness cannot see data/eval/crime_vision/manifest.csv, and anything it
      # writes lands in the container layer and disappears on recreate.
      - ./backend/data:/app/data
      # Data the services read at import time.
      - ./backend/police_stations.csv:/app/police_stations.csv:ro
      - ./backend/bangladesh_crime_data_full.csv:/app/bangladesh_crime_data_full.csv:ro
      # B6a. One client file, read-only, so a CROSS-CODEBASE contract test can run
      # in the environment this project actually runs tests in.
      #
      # `tests/invariants/test_alert_channels_match_the_client.py` asserts the
      # backend never sends an Android `channelId` the app did not create — a
      # mismatch is silent on both sides, and the notification arrives with
      # default importance and no sound. Checking it needs to read
      # frontend/src/features/alerts/channels.ts.
      #
      # Without this mount the test skips, and it would skip *always*: there is no
      # backend venv on this project's machines, so `scripts/check.sh` skips the
      # host path too. A contract test that never runs is worse than none, because
      # the suite still counts it.
      #
      # Mounted at the path it would have on the host, so the test's path lookup
      # is the same code in both environments.
      - ./frontend/src/features/alerts/channels.ts:/frontend/src/features/alerts/channels.ts:ro
      # B2. The client half of the contract-drift check, same arrangement and
      # same reason as the line above.
      #
      # `tests/invariants/test_contracts_do_not_drift.py` compares each Pydantic
      # contract against the `*Wire` interface that mirrors it, and each
      # `Literal`/`StrEnum` against the client's matching union. The failure it
      # exists for is silent on both halves: rename `source_count` on the server
      # and the client reads `undefined`, which renders as a blank line rather
      # than an error.
      #
      # The services files hold the wire interfaces; types/contracts holds the
      # vocabularies. Read-only, mounted at their host paths so the test's
      # lookup is the same code in both environments.
      - ./frontend/src/services/risk.service.ts:/frontend/src/services/risk.service.ts:ro
      - ./frontend/src/services/geo.service.ts:/frontend/src/services/geo.service.ts:ro
      - ./frontend/src/types/contracts:/frontend/src/types/contracts:ro
      # B9. Two more client files the backend suite reads, same arrangement.
      #
      # `agents.service.ts` carries `AgentHealthWire`/`FleetStatusWire`, so it
      # joins the drift check above. `agentCatalogue.ts` is checked by
      # `tests/test_agent_health.py`: it holds the plain-language title and blurb
      # for each agent, and the server is the only side that knows the real list
      # of agents, so coverage has to be asserted from here.
      - ./frontend/src/services/agents.service.ts:/frontend/src/services/agents.service.ts:ro
      - ./frontend/src/features/status/agentCatalogue.ts:/frontend/src/features/status/agentCatalogue.ts:ro
      # JG2 (Journey Guardian), added 16 Oct. Same arrangement, and it is the
      # paragraph at the top of this block coming true a second time.
      #
      # `tests/invariants/test_journey_deadline.py` has three checks on the three
      # strings both sides must spell identically: the check-in notification's
      # Android channel id, the action-button category and id, and the grace
      # period the planner prints before the journey exists. Each failure is
      # silent in the worst way — buttons that are absent, or a person told
      # "check in by 10:40" and asked at 10:55.
      #
      # All three were skipping. Their `needs_client` guard keys off checkIn.ts,
      # which was not mounted, so the channels check skipped too even though
      # channels.ts is mounted above. And `scripts/check.sh` skips host pytest
      # for want of a backend venv — so these never ran anywhere, in either
      # environment, which is exactly what lines 76-79 warn about.
      - ./frontend/src/features/journey/checkIn.ts:/frontend/src/features/journey/checkIn.ts:ro
      - ./frontend/src/features/journey/deadline.ts:/frontend/src/features/journey/deadline.ts:ro
      # Was ~700 MB of model weights (YOLOv9c 82 MB, CLIP ~600 MB), downloaded
      # on the first AI request. D07 deleted both: nothing in the image loads
      # local weights any more. Kept only because HF_HOME/TORCH_HOME still point
      # here and an unset cache dir would write into the container layer.
      - model_cache:/cache
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ===========================================================================
  # worker — the agent schedule (D04)
  # ===========================================================================
  # Celery worker with beat embedded (-B): one container, one process tree, and
  # concurrency 1 so two agents never compete for the same free-tier quota. The
  # schedule comes from each agent's `cron` (app/agents/registry.py): the Live
  # Risk Agent every 15 minutes, the expiry sweep every 30.
  #
  # Same image as `api`. It never imports the vision stack, so it starts in
  # seconds. `.env` changes need `up -d --force-recreate worker`, like `api`.
  worker:
    image: meridian-api:dev
    container_name: meridian-worker
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      disable: true
    command: celery -A app.core.celery_app worker -B --concurrency 1 --loglevel info

  # ===========================================================================
  # redis — cache + Celery broker
  # ===========================================================================
  # Unused by application code until the geo-proxy cache lands in S05, but
  # app/core/redis.py builds a client at import and config requires a URL, so
  # it is simpler to have it running than to special-case its absence.
  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # osrm — local routing engine   [profile: osrm]
  # ===========================================================================
  # Opt-in because it needs a one-time ~1 GB download and 10–30 minutes of
  # preprocessing. Without it, route_service falls back to the public demo
  # server at router.project-osrm.org, which is rate-limited and unsuitable for
  # anything but a demo (S05 makes that fallback explicit and loud).
  #
  # One-time setup, from the repo root:
  #   mkdir -p osrm-data && cd osrm-data
  #   curl -O https://download.geofabrik.de/asia/bangladesh-latest.osm.pbf
  #   docker run -t -v "${PWD}:/data" osrm/osrm-backend osrm-extract -p /opt/car.lua /data/bangladesh-latest.osm.pbf
  #   docker run -t -v "${PWD}:/data" osrm/osrm-backend osrm-partition /data/bangladesh-latest.osrm
  #   docker run -t -v "${PWD}:/data" osrm/osrm-backend osrm-customize /data/bangladesh-latest.osrm
  #
  # Then set OSRM_BASE_URL=http://osrm:5000 in backend/.env.
  osrm:
    image: osrm/osrm-backend
    container_name: meridian-osrm
    profiles: [osrm]
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/bangladesh-latest.osrm
    restart: unless-stopped

  # ===========================================================================
  # expo — Metro bundler in a container   [profile: mobile]
  # ===========================================================================
  # Provided because it was asked for, but running Expo natively is the better
  # default on Windows and macOS. Three reasons, all of which cost you time
  # rather than merely being untidy:
  #
  #  1. File watching. Metro relies on inotify, which does not propagate
  #     reliably across Docker Desktop bind mounts. Hot reload becomes slow or
  #     stops working, and the failure is silent.
  #  2. Host addressing. Your phone must reach Metro directly, so the container
  #     has to advertise the host's LAN IP rather than its own — hence
  #     REACT_NATIVE_PACKAGER_HOSTNAME below. Get it wrong and the QR code
  #     scans fine and then hangs on "Downloading JavaScript bundle".
  #  3. No native builds. `expo run:android` / `run:ios` need the Android SDK or
  #     Xcode on the host regardless.
  #
  # `scripts/run.ps1` therefore containerises the backend and runs Expo on the
  # host, which removes all three problems and is still one command.
  expo:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: meridian-expo:dev
    container_name: meridian-expo
    profiles: [mobile]
    env_file:
      - ./frontend/.env
    environment:
      # MUST be your machine's LAN IP, not localhost and not the container IP.
      # scripts/run.ps1 detects it; set HOST_LAN_IP yourself if running compose
      # by hand.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:-127.0.0.1}
      EXPO_PUBLIC_API_BASE_URL: http://${HOST_LAN_IP:-127.0.0.1}:8000/api/v1
      # Polling fallback for the inotify problem above. It works, at the cost of
      # CPU and some latency.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"   # Metro
      - "19000:19000" # Expo dev server
      - "19001:19001"
      - "19006:19006" # web
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container's node_modules is not shadowed by the
      # host directory, which holds Windows-built binaries.
      - /app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true
    command: npx expo start --host lan

volumes:
  redis_data:
  model_cache:
